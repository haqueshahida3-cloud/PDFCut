# electron-builder configuration. Run: npm run dist   (or npm run dist:deb)
appId: app.pdfcut.desktop
productName: PDFCut
copyright: Copyright © 2026 PDFCut contributors
publish: null
asar: true
npmRebuild: false
directories:
  output: release
  buildResources: build

# Only the built web app, the Electron shell and the bundled CLI go into the package.
files:
  - dist/**/*
  - dist-electron/**/*
  - electron/**/*
  - package.json
  - "!**/*.map"
  - "!electron/assets/*.map"
  - "!node_modules/**/*"

# The CLI and the terminal launcher are copied next to the app (outside app.asar) so /usr/bin/pdfcut can run
# command-line tasks with ELECTRON_RUN_AS_NODE=1, without a display.
extraResources:
  - from: dist-electron/cli.cjs
    to: cli/cli.cjs
  - from: dist-electron/cli-main.cjs
    to: cli/cli-main.cjs
  - from: build/pdfcut-launcher.sh
    to: pdfcut-launcher.sh

extraMetadata:
  main: electron/main.cjs

linux:
  target:
    - target: deb
      arch: [x64]
    - target: AppImage
      arch: [x64]
  icon: build/icons
  syncDesktopName: true
  category: Office
  executableName: pdfcut
  synopsis: Free, private, offline PDF toolkit
  description: >-
    PDFCut splits, merges, reorders, compresses, converts, OCRs, annotates, redacts and secures
    PDF files entirely on your computer. There are no accounts, ads, watermarks or uploads.
    Includes a command line (pdfcut split, merge, compress, ocr, protect, repair, convert).
  mimeTypes:
    - application/pdf
  maintainer: PDFCut Developers <dev@pdfcut.local>
  vendor: PDFCut Developers
  desktop:
    entry:
      Name: PDFCut
      GenericName: PDF Toolkit
      Comment: Split, merge, compress and secure PDFs offline
      Keywords: PDF;split;merge;compress;OCR;redact;sign;
      Categories: Office;Viewer;Utility;
      StartupWMClass: PDFCut
      StartupNotify: "true"
    desktopActions:
      split:
        Name: Split PDF
        Exec: /usr/bin/pdfcut --open-tool split
        Icon: pdfcut
      merge:
        Name: Merge PDFs
        Exec: /usr/bin/pdfcut --open-tool merge
        Icon: pdfcut
      compress:
        Name: Compress PDF
        Exec: /usr/bin/pdfcut --open-tool compress
        Icon: pdfcut

deb:
  # Command-line tools used by the CLI (ocr, protect, repair) and the OCR/compress features.
  # The Electron runtime libraries are listed with both the Ubuntu 24.04 (t64) and older names.
  depends:
    - qpdf
    - ghostscript
    - tesseract-ocr
    - tesseract-ocr-eng
    - poppler-utils
    - xdg-utils
    - libgtk-3-0t64 | libgtk-3-0
    - libnss3
    - libxss1
    - libxtst6
    - libasound2t64 | libasound2
    - libatspi2.0-0t64 | libatspi2.0-0
    - libsecret-1-0
    - libuuid1
    - libgbm1
    - libdrm2
  recommends:
    - libsane1
    - tesseract-ocr-osd
  packageCategory: utils
  compression: xz
  # Our scripts start from the electron-builder defaults and add the launcher handling (see the files).
  afterInstall: build/after-install.tpl
  afterRemove: build/after-remove.tpl
