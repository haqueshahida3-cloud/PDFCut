name: Build PDFCut for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # code signing nei, tai auto-discovery bondho (na hole warning/error ashte pare)
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # electron-builder nijer theke publish korbe na
      GH_TOKEN: ""

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate icons
        run: npm run icons

      - name: Build web app
        run: npm run build

      - name: Build Electron main process
        run: npm run build:electron

      - name: Build Windows installer (NSIS) and Microsoft Store (AppX)
        run: npx electron-builder --win nsis appx --x64 --publish never

      - name: List build output
        run: Get-ChildItem release -Recurse -Include *.exe,*.appx | Select-Object FullName

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: PDFCut-Windows-Installer
          path: release/*.exe
          if-no-files-found: error

      - name: Upload Microsoft Store package
        uses: actions/upload-artifact@v4
        with:
          name: PDFCut-Microsoft-Store
          path: release/*.appx
          if-no-files-found: error

      - name: Attach to GitHub Release (only on v* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.appx
