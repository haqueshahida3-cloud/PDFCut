
name: Build PDFCut for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate package.json
        run: node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8')); console.log('JSON OK')"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate icons
        run: npm run icons

      - name: Build web application
        run: npm run build

      - name: Build Electron main process
        run: npm run build:electron

      - name: Verify Electron Builder configuration
        run: npx electron-builder --help

      - name: Build Windows NSIS installer
        run: npx electron-builder --win nsis --x64 --publish never

      - name: List NSIS output
        shell: pwsh
        run: Get-ChildItem release -Filter *.exe

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: PDFCut-Windows-Installer
          path: release/*.exe
          if-no-files-found: error

      - name: Build Microsoft Store AppX package
        run: npx electron-builder --win appx --x64 --publish never

      - name: List AppX output
        shell: pwsh
        run: Get-ChildItem release -Filter *.appx

      - name: Upload Microsoft Store package
        uses: actions/upload-artifact@v4
        with:
          name: PDFCut-Microsoft-Store
          path: release/*.appx
          if-no-files-found: error
