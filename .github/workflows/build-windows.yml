
name: Build PDFCut for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate icons
        run: npm run icons

      - name: Build web application
        run: npm run build

      - name: Build Electron application
        run: npm run build:electron

      - name: Check build folders
        shell: pwsh
        run: |
          if (!(Test-Path "dist")) {
            throw "dist folder was not created."
          }

          if (!(Test-Path "dist-electron")) {
            throw "dist-electron folder was not created."
          }

      - name: Build Windows installer (NSIS)
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Check NSIS output
        shell: pwsh
        run: |
          if (Test-Path "dist") {
            Get-ChildItem "dist" -Filter "*.exe" -File
          } else {
            throw "dist folder not found."
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: PDFCut-Windows-Installer
          path: dist/*.exe
          if-no-files-found: error

      - name: Build Microsoft Store AppX
        run: npx electron-builder --win appx --x64 --publish never

      - name: List build output
        shell: pwsh
        run: |
          Write-Host "PDFCut build output:"
          if (Test-Path "dist") {
            Get-ChildItem "dist" -Recurse -File
          } else {
            throw "dist folder not found."
          }

      - name: Upload Microsoft Store package
        uses: actions/upload-artifact@v4
        with:
          name: PDFCut-Microsoft-Store
          path: |
            dist/*.appx
            dist/*.msix
          if-no-files-found: error

      - name: Attach files to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.appx
            dist/*.msix
